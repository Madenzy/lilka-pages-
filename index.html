<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lilka – Find what’s on</title>
  <meta name="description" content="Discover local events and book tickets on Lilka.">
  <link rel="icon" href="images/lilka-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="index.html" aria-label="Lilka home"><img src="images/lilka-wordmark.png" alt="Lilka" width="135" height="28"></a>

      <label class="site-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3AAB8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span class="visually-hidden">Search events</span>
        <input id="search" type="search" placeholder="Search events, venues or organisers" autocomplete="off">
      </label>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="index.html" aria-current="page">Events</a>
        <a href="book.html">Book an appointment</a>
        <a class="btn btn-primary" href="organiser.html">Create an event</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero__inner">
        <div>
          <p class="tagline"><span class="t1">DISCOVER.</span> <span class="t2">CREATE.</span> <span class="t3">EXPERIENCE.</span></p>
          <h1>Find what’s on and be part of it.</h1>
        </div>
        <img class="hero__mark" src="images/lilka-mark.png" alt="" width="150" height="145">
      </div>
    </section>

    <div class="container">
      <section class="filters" aria-label="Filter events">
        <div class="pill-group" role="group" aria-label="Category" id="categories"></div>
        <div class="pill-group">
          <label class="visually-hidden" for="when">When</label>
          <select class="pill-select" id="when">
            <option value="any">Any date</option>
            <option value="weekend">This weekend</option>
            <option value="week">Next 7 days</option>
            <option value="month">Next 30 days</option>
          </select>
          <button class="pill pill--quiet" type="button" id="free-only" aria-pressed="false">Free only</button>
        </div>
      </section>

      <p class="visually-hidden" id="results-count" aria-live="polite"></p>
      <section class="event-grid" id="event-grid" aria-label="Events"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>© <span data-year></span> Lilka · Discover. Create. Experience.</span>
      <nav aria-label="Footer">
        <a href="book.html">Book an appointment</a>
        <a href="dashboard.html">Business dashboard</a>
        <a href="organiser.html">Organiser dashboard</a>
      </nav>
      <nav class="legal-links" aria-label="Legal">
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
        <a href="cookies.html">Cookies</a>
        <a href="refunds.html">Refunds</a>
        <a href="legal.html">All policies</a>
      </nav>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
