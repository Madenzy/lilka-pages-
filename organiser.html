<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lilka – Organiser dashboard</title>
  <link rel="icon" href="images/lilka-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="sidebar__brand" href="index.html" aria-label="Lilka home"><img src="images/lilka-wordmark.png" alt="Lilka" width="116" height="24"></a>
      <nav class="sidebar__nav" aria-label="Dashboard">
        <a href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Appointments</a>
        <a href="organiser.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 0 0 6v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 17v2M13 11v2"/></svg>My events</a>
        <a href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Public site</a>
      </nav>
      <p class="sidebar__foot">Demo data lives in this browser. <a href="#" data-reset-demo>Reset demo</a><br><a href="organiser-terms.html">Organiser terms</a> · <a href="privacy.html">Privacy</a></p>
    </aside>

    <main class="app-main">
      <div class="page-head">
        <div>
          <label class="sub" for="event-picker" id="event-meta"></label>
          <h1 id="event-title"></h1>
        </div>
        <div class="actions">
          <select class="select" id="event-picker" style="width:auto;min-width:220px;border-radius:999px" aria-label="Choose event"></select>
          <a class="btn btn-outline" id="view-page" href="#">View event page</a>
          <button class="btn btn-primary" type="button" id="checkin-open">Start check-in</button>
        </div>
      </div>

      <div class="stat-grid">
        <div class="card stat">
          <span class="eyebrow">Tickets sold</span>
          <span class="stat__value" id="stat-sold"></span>
          <div class="bar"><span id="stat-bar"></span></div>
        </div>
        <div class="card stat">
          <span class="eyebrow">Gross sales</span>
          <span class="stat__value" id="stat-gross"></span>
          <span class="stat__note" id="stat-gross-note">Paid out after the event</span>
        </div>
        <div class="card-dark stat">
          <span class="eyebrow">Days to go</span>
          <span class="stat__value" id="stat-days"></span>
          <span class="stat__note" id="stat-days-note"></span>
        </div>
      </div>

      <div class="dash-cols">
        <section class="card types" aria-labelledby="types-h">
          <h2 id="types-h">By ticket type</h2>
          <div id="type-rows" style="display:flex;flex-direction:column;gap:20px"></div>
          <div class="share">
            <span>Share link: <code id="share-link"></code></span>
            <button class="link-btn" type="button" id="copy-link" style="align-self:flex-start;min-height:32px">Copy link</button>
          </div>
        </section>

        <section class="card orders-card" aria-labelledby="orders-h">
          <div class="orders-card__head">
            <h2 id="orders-h">Recent orders</h2>
            <span class="muted" style="font-size:14px" id="orders-count"></span>
          </div>
          <div class="table-scroll">
            <table class="data-table" style="font-size:14px">
              <thead><tr><th scope="col">Customer</th><th scope="col" class="hide-sm">Tickets</th><th scope="col">Amount</th><th scope="col">Status</th></tr></thead>
              <tbody id="orders"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Check-in -->
  <dialog class="dialog" id="checkin">
    <div class="dialog__inner">
      <div class="dialog__head">
        <div>
          <h2>Check-in</h2>
          <p class="muted" style="font-size:14px" id="checkin-progress"></p>
        </div>
        <button class="icon-btn" type="button" data-close aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <label class="field"><span class="visually-hidden">Search guests</span>
        <input class="input" type="search" id="checkin-search" placeholder="Search name or order reference" autocomplete="off">
      </label>
      <ul class="checkin-list" id="checkin-list"></ul>
    </div>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/organiser.js"></script>
</body>
</html>
