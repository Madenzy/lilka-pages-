<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lilka – Bookings dashboard</title>
  <link rel="icon" href="images/lilka-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="sidebar__brand" href="index.html" aria-label="Lilka home"><img src="images/lilka-wordmark.png" alt="Lilka" width="116" height="24"></a>
      <nav class="sidebar__nav" aria-label="Dashboard">
        <a href="dashboard.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bookings</a>
        <a href="organiser.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 0 0 6v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 17v2M13 11v2"/></svg>My events</a>
        <a href="book.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>Booking page</a>
        <a href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Public site</a>
      </nav>
      <p class="sidebar__foot">Demo data lives in this browser. <a href="#" data-reset-demo>Reset demo</a><br><a href="organiser-terms.html">Organiser terms</a> · <a href="privacy.html">Privacy</a></p>
    </aside>

    <main class="app-main">
      <div class="page-head">
        <div>
          <p class="sub" id="today-label"></p>
          <h1 id="page-title">Today’s bookings</h1>
        </div>
        <div class="actions">
          <div class="segmented" role="tablist" aria-label="Range" id="range">
            <button type="button" role="tab" data-range="today" aria-selected="true">Today</button>
            <button type="button" role="tab" data-range="week" aria-selected="false">Week</button>
            <button type="button" role="tab" data-range="month" aria-selected="false">Month</button>
          </div>
          <a class="btn btn-primary" href="book.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            New booking
          </a>
        </div>
      </div>

      <div class="dash-cols">
        <section class="card table-card" aria-labelledby="page-title">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th scope="col">Time</th><th scope="col">Customer</th><th scope="col" class="hide-sm">Service</th><th scope="col">Status</th></tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>

        <aside class="detail-aside">
          <div class="card detail" id="detail" aria-live="polite"></div>
          <div class="card-dark next-slot">
            <span class="eyebrow">Next free slot</span>
            <strong id="next-slot">—</strong>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <!-- Reschedule -->
  <dialog class="dialog" id="resched">
    <form class="dialog__inner" id="resched-form" novalidate>
      <div class="dialog__head">
        <h2>Reschedule</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="muted" id="resched-who" style="font-size:14px"></p>
      <label class="field">New date
        <input class="input" type="date" name="date" required>
        <span class="field-error" data-for="date"></span>
      </label>
      <label class="field">New time
        <select class="select" name="time" required></select>
        <span class="field-error" data-for="time"></span>
      </label>
      <button class="btn btn-primary" type="submit">Save new time</button>
    </form>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
